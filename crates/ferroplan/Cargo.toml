[package]
name = "ferroplan"
description = "A fast, data-parallel PDDL planner in Rust — FF heuristic with ADL, numeric, derived axioms, PDDL3 preferences, PDDL2.1 temporal, and a goal decomposer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
# The SAT compilation wing's solver (0.24 Phase 2) — the first wiring of
# the absorbed crate, version-pinned like every other in-workspace dep.
ferroplan-sat = { path = "../ferroplan-sat", version = "0.23.0" }
serde = { workspace = true }
thiserror = { workspace = true }
schemars = { version = "1.2.2", optional = true }

[features]
# Derives `schemars::JsonSchema` on the public solver-configuration types
# (`Options`, `Mode`, `Search`) so consumers — e.g. an MCP server generating
# tool-input JSON Schema — get a typed schema instead of an opaque `Value`.
# Off by default: crates that don't need it (ferroplan-wasm, ferroplan-cli,
# ferroplan-bevy) don't pay for it.
schema = ["dep:schemars"]

[dev-dependencies]
serde_json = { workspace = true }
criterion = "0.8"

[[bench]]
name = "planning"
harness = false
