[package]
name = "crucible-publish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# PURE. No rusqlite, no ratatui, no libproc, no platform calls, no clock. The
# golden battery is the only thing that proves this is a port rather than a
# rewrite, so it has to run on any box in seconds without linking a database or
# a TUI.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# The IPC-5 field archive is a vendored .tar.gz of .soln files
# (benchmarks/IPC5-results.tgz, tracked). rust_backend so no system zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
