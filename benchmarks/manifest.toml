# benchmarks/manifest.toml -- the sweep instrument, versioned with the planner.
#
# GENERATED by crucible/tools/gen-manifest.py from the registries it
# consolidates. Re-verify with `--check` after editing either side.
#
# Lookbehind equivalence: verified over 292 variant dirs.

schema = 1

[corpus]
root = ".ipc-corpus"          # relative to benchmarks/; $FERROPLAN_IPC_CORPUS wins
domain_shared = "domain.pddl"
domain_per_instance = "domains/domain-{first}.pddl"

[defaults]
timeout_secs = 60
jobs = 2                      # docs/migration-m5.md: 2 not 3 -- fanless box,
                              # clocks must stay stable across a multi-hour sweep
threads = 1
mode = "auto"
mem_gb = 6.0                  # not the phys/jobs default of 8: 2x6 against 16 GiB
                              # leaves headroom for the 0.25 s RSS poll

# ---------------------------------------------------------------------------
# TRACKS -- the corpus selector. NOT an enumeration: the corpus is gitignored,
# so a list of 6,584 instances would drift from disk with nothing to notice.
# From ipc67.py TRACK_PATTERNS + TRACK_IPCS.
# ---------------------------------------------------------------------------

[track.agile-2023]
ipcs = ["ipc-2023"]
include = "-agile$"

[track.complex-pref-2006]
ipcs = ["ipc-2006"]
include = "preferences-complex$"

[track.constraints-2006]
ipcs = ["ipc-2006"]
include = "constraints"

[track.metric-time-2006]
ipcs = ["ipc-2006"]
include = "metric-time(-strips)?$"

[track.net-benefit]
ipcs = ["ipc-2008", "ipc-2011"]
include = "net-benefit"

[track.numeric-2023]
ipcs = ["ipc-2023n"]
include = "numeric-satisficing"

[track.numeric-2026]
ipcs = ["ipc-2026n"]
include = "numeric-2026"

[track.opt-2018]
ipcs = ["ipc-2018"]
include = "sequential-optimal"

[track.opt-2023]
ipcs = ["ipc-2023"]
include = "-optimal$"

[track.opt-2026]
ipcs = ["ipc-2026n"]
include = "-opt-numeric-2026"

[track.opt-2026-full]
ipcs = ["ipc-2026n"]
include = "-numeric-2026"
exclude = "-sat-numeric-2026"   # was Python's '-sat' lookbehind

[track.prop-2006]
ipcs = ["ipc-2006"]
include = "propositional(-strips)?$"

[track.qual-pref-2006]
ipcs = ["ipc-2006"]
include = "preferences-qualitative$"

[track.sat-2018]
ipcs = ["ipc-2018"]
include = "sequential-satisficing"

[track.sat-2023]
ipcs = ["ipc-2023"]
include = "-satisficing$"

[track.seq-agile-2014]
ipcs = ["ipc-2014"]
include = "sequential-agile"

[track.seq-mco]
ipcs = ["ipc-2011"]
include = "sequential-multi-core"

[track.seq-mco-2014]
ipcs = ["ipc-2014"]
include = "sequential-multi-core"

[track.seq-opt]
ipcs = ["ipc-2008", "ipc-2011"]
include = "sequential-optimal"

[track.seq-opt-2014]
ipcs = ["ipc-2014"]
include = "sequential-optimal"

[track.seq-sat]
ipcs = ["ipc-2008", "ipc-2011"]
include = "sequential-satisficing"

[track.seq-sat-2014]
ipcs = ["ipc-2014"]
include = "sequential-satisficing"

[track.simple-pref-2006]
ipcs = ["ipc-2006"]
include = "preferences-simple$"

[track.tempo-sat]
ipcs = ["ipc-2008", "ipc-2011"]
include = "temporal-satisficing"

[track.tempo-sat-2014]
ipcs = ["ipc-2014"]
include = "temporal-satisficing"

[track.time-2006]
ipcs = ["ipc-2006"]
include = "-time(-strips)?$"
exclude = "metric-time(-strips)?$"   # was Python's 'metric' lookbehind

