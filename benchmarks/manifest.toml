# ---------------------------------------------------------------------------
# SETS -- what a driver invocation sweeps. Two staging dirs by design: the
# standing 22 keep their like-for-like identity, the entries stage apart,
# and the cut record carries TWO headlines.
# ---------------------------------------------------------------------------

