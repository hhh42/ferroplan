[workspace]
resolver = "2"
members = [
    "crates/ferroplan",
    "crates/ferroplan-cli",
    "crates/ferroplan-bevy",
    "crates/ferroplan-wasm",
    "crates/ferroplan-mcp",
    "crates/ferroplan-sat",
]
# Built standalone via maturin (pyo3 extension-module doesn't link libpython, so
# a plain workspace `cargo build` would fail to link).
# crucible/ is its own workspace root (crucible/Cargo.toml) and would stop
# cargo's upward walk on its own; listing it here documents the intent and
# survives someone deleting that [workspace] table. It keeps the sweep harness
# out of `cargo test --all`, the clippy gate, publish.sh and the RELEASING.md
# pre-flight -- a ratatui/rusqlite dep tree must never gate a planner release.
exclude = ["crates/ferroplan-py", "crucible"]

[workspace.package]
version = "0.25.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hhh42/ferroplan"
homepage = "https://hhh42.github.io/ferroplan"
authors = ["Harold Hersey <haroldhhersey@gmail.com>"]
keywords = ["pddl", "planner", "planning", "ai", "heuristic-search"]
categories = ["science", "command-line-utilities", "algorithms"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1

# Release-optimized but with debug symbols, for profiling (flamegraph / samply).
# Build with `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
