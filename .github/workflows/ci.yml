name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Core library + CLI. Excludes the Bevy GUI (the engine needs heavy system
  # libraries to build on Linux; it's built locally for now).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude ferroplan-bevy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude ferroplan-bevy
      # The IPC-benchmark regression guards (espc / ipc5_pref_metric) are `#[ignore]`d
      # so they don't bloat the default `cargo test` (and the publish pre-flight) with
      # multi-minute solves. Run them here in release, where they're ~3× faster.
      - name: Heavy IPC regression guards (release)
        run: cargo test --release -p ferroplan -- --ignored
      - name: Docs
        run: cargo doc --no-deps --all-features --workspace --exclude ferroplan-bevy
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Bench compiles (perf gate)
        run: cargo bench --no-run -p ferroplan

  # The Claude Code plugin's Python control plane. A separate job on purpose:
  # a plugin failure must not be masked by a Rust failure, and this runs in
  # ~30s without a toolchain, so it stays useful when the workspace is red.
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/chatman-ecosystem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The realistic floor for a user's Claude Code, not the local 3.14.
          # Pinning low is what surfaces accidental 3.12+ syntax here rather
          # than in someone's session.
          python-version: '3.11'
      - name: Install tooling
        # typer is a runtime dependency of the CLI layer (not of the hook path,
        # which stays standard-library only so the actuation fence cannot be
        # taken down by a missing import).
        run: pip install --quiet pytest ruff typer
      - name: Lint
        run: ruff check scripts tests
      # Replaces the manual `py_compile` of 3 of 9 scripts in skills/doctor.
      - name: Compile every script
        run: python -m compileall -q scripts
      - name: Shell syntax
        run: for f in scripts/*.sh; do sh -n "$f"; done
      - name: Test
        run: pytest
