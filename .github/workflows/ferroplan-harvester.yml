name: Ferroplan Evidence Harvester

on:
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'crates/ferroplan/**'
      - 'crates/ferroplan-cli/**'
      - 'crates/ferroplan-mcp/**'
      - 'plugins/chatman-ecosystem/**'
      - '.github/workflows/ferroplan-harvester.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ferroplan-harvester-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: ''

jobs:
  harvest-boundary:
    name: Receipt and replay deep lane
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact head identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || exit 42
      - name: Install Rust admission toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Install Python verifier toolchain
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install verifier dependencies
        run: pip install --quiet pytest ruff coverage typer pydantic jsonschema rdflib pyshacl
      - name: Refuse dirty source before manufacture
        run: |
          cargo fmt --all -- --check
          git diff --exit-code
      - name: Execute Rust admission boundaries
        run: |
          cargo check -p ferroplan-cli --bin ferroplan-harvest --tests
          cargo check -p ferroplan-mcp --bins --tests
          cargo test -p ferroplan-cli --test harvest
          cargo test -p ferroplan-mcp --test admission_protocol
          cargo test -p ferroplan-mcp --test session_protocol
          cargo test -p ferroplan-mcp --test session
          cargo test -p ferroplan-mcp --test session_control
          cargo test -p ferroplan-mcp --test experience_plane
          cargo test -p ferroplan-mcp --test merged_server
          cargo test -p ferroplan-mcp --test protocol
          cargo test -p ferroplan-mcp --bin ferroplan-mcp-plus
          cargo test -p ferroplan --test fortune5_capabilities
          cargo test -p ferroplan --test fortune5_explain_parallel
      - name: Execute plugin control plane
        working-directory: plugins/chatman-ecosystem
        run: |
          ruff check scripts tests
          python -m compileall -q scripts
          for f in scripts/*.sh; do sh -n "$f"; done
          python scripts/validate-claude-projection.py --plugin-root .
          python scripts/generate.py build --check
          pytest
      - name: Execute closed-window live GitHub harvest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf target/live-harvest
          cargo run -p ferroplan-cli --bin ferroplan-harvest -- run --repo seanchatmangpt/ferroplan --since 2026-07-31T07:00:00Z --until 2026-08-01T07:00:00Z --timezone America/Los_Angeles --max-pages 10 --output-dir target/live-harvest
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('target/live-harvest/receipt.json').read_text())
          if receipt['final_state'] not in {'PARTIAL_ALIVE', 'ALIVE'}:
              raise SystemExit(f"LIVE_HARVEST_NOT_ADMITTED: {receipt['final_state']}")
          if not receipt['admitted_work']:
              raise SystemExit('LIVE_HARVEST_EMPTY_ADMISSION')
          PY
      - name: Refuse uncommitted manufacture
        run: git diff --exit-code
      - name: Upload complete receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ferroplan-complete-receipts-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/live-harvest
          if-no-files-found: warn
          retention-days: 30
