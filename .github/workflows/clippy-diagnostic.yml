name: Clippy Diagnostic

on:
  push:
    branches:
      - agent/daily-agent-ppddl-2026-08-02

permissions:
  contents: read

jobs:
  clippy-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Capture strict Clippy diagnostics
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --exclude ferroplan-bevy --all-targets --all-features --message-format=json -- -D warnings 2>&1 | tee clippy-diagnostic.jsonl
      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostic-${{ github.sha }}
          path: clippy-diagnostic.jsonl
          if-no-files-found: error
