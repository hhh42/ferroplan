name: Vision 2030 Experience Plane Projector

on:
  pull_request:
    paths:
      - "tools/apply-experience-plane.py"
      - "crates/ferroplan-mcp/src/experience.rs"
      - "crates/ferroplan-mcp/src/main.rs"
      - "crates/ferroplan-mcp/tests/experience_plane.rs"
      - "crates/ferroplan-mcp/tests/merged_server.rs"
      - "crates/ferroplan-mcp/tests/protocol.rs"
      - ".github/workflows/experience-plane-projector.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vision-2030-experience-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: ""

jobs:
  project-and-prove:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Project merged authority
        run: |
          if ! grep -q '^mod experience;' crates/ferroplan-mcp/src/main.rs; then
            python3 tools/apply-experience-plane.py
          fi
          cargo fmt --all

      - name: Compile and execute experience falsifiers
        run: |
          cargo check -p ferroplan-mcp --all-targets
          cargo test -p ferroplan-mcp --test experience_plane
          cargo test -p ferroplan-mcp --test merged_server
          cargo test -p ferroplan-mcp --test protocol
          cargo clippy -p ferroplan -p ferroplan-mcp --all-targets --no-deps -- -D warnings

      - name: Commit verified product projection
        run: |
          git config user.name "ferroplan-vision-controller"
          git config user.email "ferroplan-vision-controller@users.noreply.github.com"
          git add \
            crates/ferroplan-mcp/src/main.rs \
            crates/ferroplan-mcp/src/experience.rs \
            crates/ferroplan-mcp/tests/experience_plane.rs \
            crates/ferroplan-mcp/tests/merged_server.rs \
            crates/ferroplan-mcp/tests/protocol.rs
          if ! git diff --cached --quiet; then
            git commit -m "feat(mcp): activate 42-tool operator experience plane"
            git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
          fi

      - name: Verify no unowned product drift
        run: |
          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$dirty" ]; then
            printf 'UNOWNED_EXPERIENCE_PROJECTION_REFUSED\n%s\n' "$dirty"
            exit 1
          fi
