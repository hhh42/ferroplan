name: Ecosystem ALIVE Format Closure

on:
  pull_request:
    paths:
      - "crates/ferroplan-mcp/src/admission.rs"
      - "crates/ferroplan-mcp/tests/checkpoint8_refusals.rs"
      - "crates/ferroplan-mcp/tests/dogfood_chain.rs"
      - "crates/ferroplan-mcp/tests/recursive_admission_protocol.rs"
      - "crates/ferroplan-mcp/tests/session_goal_advance.rs"
      - "crates/ferroplan/benches/ppddl.rs"
      - "crates/ferroplan/src/lib.rs"
      - "crates/ferroplan/src/ppddl.rs"
      - "crates/ferroplan/tests/daily_agent_methods_ppddl.rs"
      - ".github/workflows/ecosystem-alive-format-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-alive-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: ""

jobs:
  verify-format-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact head identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || exit 42

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Verify formatting without mutation
        run: cargo fmt --all -- --check

      - name: Execute owned repository validation ladder
        run: |
          cargo check --workspace --exclude ferroplan-bevy --all-targets --all-features
          cargo test -p ferroplan-mcp --tests
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
