name: Session Capability Density Projector

on:
  push:
    branches:
      - agent/ferroplan-evidence-harvester
    paths:
      - "tools/apply-session-capability-density.py"
      - "crates/ferroplan-mcp/src/session_control.rs"
      - "crates/ferroplan-mcp/tests/session_control.rs"
      - ".github/workflows/session-capability-density.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: session-capability-density-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTC_WRAPPER: ""

jobs:
  project-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/ferroplan-evidence-harvester
          fetch-depth: 0

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Project the dense control plane
        run: |
          if ! grep -q 'pub fn state_fingerprint' crates/ferroplan/src/session.rs; then
            python3 tools/apply-session-capability-density.py
          fi
          cargo fmt --all

      - name: Compile and execute the restored fence
        run: |
          cargo check -p ferroplan-mcp --all-targets
          cargo test -p ferroplan-mcp --test session_control
          cargo test -p ferroplan-mcp --test merged_server
          cargo test -p ferroplan-mcp --test protocol
          cargo clippy -p ferroplan -p ferroplan-mcp --all-targets --no-deps -- -D warnings

      - name: Commit verified capability projection
        run: |
          git config user.name "ferroplan-capability-controller"
          git config user.email "ferroplan-capability-controller@users.noreply.github.com"
          git add \
            crates/ferroplan/Cargo.toml \
            crates/ferroplan/src/session.rs \
            crates/ferroplan-mcp/src/main.rs \
            crates/ferroplan-mcp/src/session.rs \
            crates/ferroplan-mcp/src/session_control.rs \
            crates/ferroplan-mcp/tests/merged_server.rs \
            crates/ferroplan-mcp/tests/protocol.rs \
            crates/ferroplan-mcp/tests/session_control.rs \
            .github/workflows/ferroplan-harvester.yml
          if ! git diff --cached --quiet; then
            git commit -m "feat(mcp): restore high-density session authority"
            git push origin HEAD:agent/ferroplan-evidence-harvester
          fi

      - name: Verify no unowned product drift
        run: |
          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$dirty" ]; then
            printf 'UNOWNED_PROJECTION_REFUSED\n%s\n' "$dirty"
            exit 1
          fi
