name: One-shot upstream sync 012b7ac

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-upstream-sync-012b7ac.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  merge-upstream:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/sync-upstream-012b7ac'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge exact upstream and remove this workflow
        shell: bash
        env:
          BASE_SHA: 64dfbb3f5f5ba313738ab6c2edf6cb1b1e5c4b07
          UPSTREAM_SHA: 012b7acb49b98ba949bc9014eaa1036821c7de7b
          WORKFLOW_PATH: .github/workflows/one-shot-upstream-sync-012b7ac.yml
        run: |
          set -euo pipefail
          trigger_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_SHA" "$trigger_sha"
          test -f "$WORKFLOW_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/hhh42/ferroplan.git
          git fetch --no-tags upstream "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"

          set +e
          git merge --no-ff --no-commit -X theirs "$UPSTREAM_SHA"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflict_file="$(mktemp)"
            git diff --name-only --diff-filter=U -z > "$conflict_file"
            while IFS= read -r -d '' path; do
              if git cat-file -e "$UPSTREAM_SHA:$path" 2>/dev/null; then
                git checkout "$UPSTREAM_SHA" -- "$path"
              else
                git rm -f --ignore-unmatch -- "$path"
              fi
            done < "$conflict_file"
            rm -f "$conflict_file"
          fi

          git rm -f "$WORKFLOW_PATH"
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "Merge upstream hhh42/ferroplan main at 012b7ac" \
            -m "Preserve fork history. Resolve overlapping and irreducible conflicts in favor of the exact upstream head."

          test "$(git rev-parse HEAD^1)" = "$trigger_sha"
          test "$(git rev-parse HEAD^2)" = "$UPSTREAM_SHA"
          test ! -e "$WORKFLOW_PATH"

          git push --force-with-lease="refs/heads/main:$trigger_sha" origin HEAD:refs/heads/main
